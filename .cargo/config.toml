[build]
target = "wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
rustflags = [
    # wasm4.rs declares WASM-4's host functions as plain `extern "C"` (no
    # wasm_import_module attribute); newer wasm-ld refuses undefined symbols
    # by default, so tell it to keep them as imports instead of erroring.
    "-C", "link-arg=--allow-undefined",

    # Import memory from WASM-4
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--initial-memory=65536",
    "-C", "link-arg=--max-memory=65536",

    # Temporary workaround for #255 issue.
    # Reserve 8192 bytes of Rust stack space, offset from 6560.
    # Bump this value, 16-byte aligned, if the framebuffer gets corrupted.
    "-C", "link-arg=-zstack-size=14752",
]
